[project]
name = "biocompiler"
version = "0.1.0"
description = "Natural-language biological goals compiled into validated, simulated lab protocols."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.optional-dependencies]
bio = [
    "numpy>=2.0",
]
sandbox = [
    "modal>=0.67",
]
vision = [
    "numpy>=2.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biocompiler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
